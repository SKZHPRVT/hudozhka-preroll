<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="telegram-web-app-capable" content="yes">
    <title>Награды — Рисовашка</title>
    <style>
        :root { --pink: #FF6B9D; --purple: #9B59B6; --bg: #FFF5F8; --text: #2C3E50; --hint: #999999; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 80px; color: var(--text); }
        
        .top-bar { background: linear-gradient(135deg, #FF6B9D, #9B59B6); color: white; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
        .back-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }
        .top-bar-title { flex: 1; font-size: 16px; font-weight: 700; }
        
        .balance-card {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #8B4513;
            border-radius: 20px;
            padding: 24px;
            margin: 16px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(255,165,0,0.3);
        }
        .balance-label { font-size: 13px; opacity: 0.9; margin-bottom: 4px; }
        .balance-value { font-size: 42px; font-weight: 800; }
        .balance-hint { font-size: 12px; opacity: 0.8; margin-top: 6px; }
        
        .section { padding: 0 16px; margin-bottom: 20px; }
        .section-title { font-size: 18px; font-weight: 800; margin-bottom: 12px; }
        
        .reward {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.2s;
        }
        .reward.locked { opacity: 0.5; }
        .reward-emoji { font-size: 40px; flex-shrink: 0; }
        .reward-info { flex: 1; }
        .reward-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
        .reward-desc { font-size: 12px; color: var(--hint); margin-bottom: 6px; }
        .reward-cost { font-size: 13px; font-weight: 700; color: var(--purple); }
        .reward-btn {
            padding: 10px 16px;
            border-radius: 12px;
            border: none;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, #FF6B9D, #9B59B6);
            color: white;
            flex-shrink: 0;
        }
        .reward-btn:disabled { background: #ddd; cursor: not-allowed; }
        
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 8px 0 20px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; color: var(--hint); text-decoration: none; font-size: 11px; }
        .nav-item.active { color: var(--pink); }
        .nav-icon { font-size: 24px; margin-bottom: 2px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="back-btn" onclick="location.href='../index.html'">←</button>
        <div class="top-bar-title">🎁 Награды</div>
    </div>
    
    <div class="balance-card">
        <div class="balance-label">Твой баланс</div>
        <div class="balance-value" id="balance">0</div>
        <div class="balance-hint">баллов</div>
    </div>
    
    <div class="section">
        <div class="section-title">🎁 Доступные награды</div>
        <div id="rewardsList"></div>
    </div>
    
    <div class="bottom-nav">
        <a href="../index.html" class="nav-item"><span class="nav-icon">🏠</span><span>Главная</span></a>
        <a href="../draw/index.html" class="nav-item"><span class="nav-icon">✏️</span><span>Рисовать</span></a>
        <a href="../quiz/index.html" class="nav-item"><span class="nav-icon">🎯</span><span>Квест</span></a>
        <a href="index.html" class="nav-item active"><span class="nav-icon">🎁</span><span>Награды</span></a>
        <a href="../profile/index.html" class="nav-item"><span class="nav-icon">👤</span><span>Профиль</span></a>
    </div>
    
    <script>
        let tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#FF6B9D'); }
        
        const REWARDS = [
            { id: 'sticker', name: 'Стикерпак', emoji: '🎨', desc: 'Набор стикеров Рисовашки', cost: 50 },
            { id: 'discount-10', name: 'Скидка 10%', emoji: '💸', desc: 'На первый абонемент', cost: 100 },
            { id: 'notebook', name: 'Скетчбук', emoji: '📓', desc: 'Фирменный скетчбук', cost: 300 },
            { id: 'discount-20', name: 'Скидка 20%', emoji: '🎁', desc: 'На первый абонемент', cost: 250 },
            { id: 'masterclass', name: 'Мастер-класс', emoji: '🎓', desc: 'Бесплатный МК', cost: 500 },
            { id: 'trial-free', name: 'Пробное бесплатно', emoji: '🌟', desc: 'Первое занятие', cost: 150 }
        ];
        
        function getBalance() { return parseInt(localStorage.getItem('balance') || '0'); }
        function getUsed() { return JSON.parse(localStorage.getItem('usedRewards') || '[]'); }
        
        function renderRewards() {
            const balance = getBalance();
            const used = getUsed();
            
            document.getElementById('balance').textContent = balance;
            
            document.getElementById('rewardsList').innerHTML = REWARDS.map(r => {
                const canAfford = balance >= r.cost;
                const alreadyUsed = used.includes(r.id);
                
                return `
                    <div class="reward ${canAfford && !alreadyUsed ? '' : 'locked'}">
                        <div class="reward-emoji">${r.emoji}</div>
                        <div class="reward-info">
                            <div class="reward-name">${r.name}</div>
                            <div class="reward-desc">${r.desc}</div>
                            <div class="reward-cost">🪙 ${r.cost} баллов</div>
                        </div>
                        <button class="reward-btn" 
                                ${!canAfford || alreadyUsed ? 'disabled' : ''}
                                onclick="redeem('${r.id}', ${r.cost}, '${r.name}')">
                            ${alreadyUsed ? '✓' : 'Обменять'}
                        </button>
                    </div>
                `;
            }).join('');
        }
        
        function redeem(id, cost, name) {
            const balance = getBalance();
            if (balance < cost) return;
            
            if (!confirm(`Обменять ${cost} баллов на "${name}"?`)) return;
            
            localStorage.setItem('balance', balance - cost);
            
            const used = getUsed();
            used.push(id);
            localStorage.setItem('usedRewards', JSON.stringify(used));
            
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            if (tg) {
                tg.sendData(JSON.stringify({
                    action: 'redeem',
                    reward: id,
                    name: name,
                    timestamp: Date.now()
                }));
            }
            
            alert(`✅ Обменяно!\n\nПокажи этот экран администратору в школе, чтобы получить "${name}".`);
            
            renderRewards();
        }
        
        renderRewards();
    </script>
</body>
</html>
