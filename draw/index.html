<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="telegram-web-app-capable" content="yes">
    <title>Рисуем — Рисовашка</title>
    <style>
        :root {
            --pink: #FF6B9D;
            --purple: #9B59B6;
            --blue: #4ECDC4;
            --bg: #FFF5F8;
            --text: #2C3E50;
            --hint: #999999;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            max-width: 480px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: var(--text);
            touch-action: none;
        }
        
        /* ========== ШАПКА ========== */
        .top-bar {
            background: linear-gradient(135deg, #FF6B9D, #9B59B6);
            color: white;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        
        .back-btn, .icon-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .top-bar-info { flex: 1; min-width: 0; }
        
        .theme-label { font-size: 10px; opacity: 0.85; margin-bottom: 2px; }
        
        .theme-text {
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* ========== ХОЛСТ ========== */
        .canvas-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            position: relative;
            min-height: 0;
            background: #E8E8E8;
        }
        
        #drawingCanvas {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            touch-action: none;
            cursor: crosshair;
            max-width: 100%;
            max-height: 100%;
            display: block;
        }
        
        .hint-bubble {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 5;
            max-width: 90%;
            text-align: center;
        }
        
        .hint-bubble.show { opacity: 1; }
        
        /* ========== ИНСТРУМЕНТЫ ========== */
        .tools {
            background: white;
            border-top: 1px solid #eee;
            padding: 8px 10px 12px;
            flex-shrink: 0;
        }
        
        .tools-top {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        
        .size-slider {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #F5F5F5;
            padding: 6px 12px;
            border-radius: 20px;
        }
        
        .size-preview {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            flex-shrink: 0;
            transition: all 0.15s;
        }
        
        #sizeSlider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            background: #ddd;
            border-radius: 2px;
            outline: none;
        }
        
        #sizeSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #FF6B9D, #9B59B6);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(255,107,157,0.4);
        }
        
        #sizeSlider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #FF6B9D, #9B59B6);
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }
        
        .quick-btn {
            background: #F5F5F5;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            flex-shrink: 0;
        }
        
        .quick-btn:active { transform: scale(0.9); }
        
        .brushes-row {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 8px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        
        .brushes-row::-webkit-scrollbar { display: none; }
        
        .brush-btn {
            min-width: 48px;
            height: 48px;
            border-radius: 12px;
            border: 2px solid transparent;
            background: #F5F5F5;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .brush-btn.active {
            border-color: var(--pink);
            background: #FFE5F0;
            transform: scale(1.05);
        }
        
        .brush-btn:active { transform: scale(0.92); }
        
        .colors-row {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 8px;
            -webkit-overflow-scrolling: touch;
            align-items: center;
            scrollbar-width: none;
        }
        
        .colors-row::-webkit-scrollbar { display: none; }
        
        .color-btn {
            min-width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: all 0.15s;
            flex-shrink: 0;
        }
        
        .color-btn.active {
            transform: scale(1.3);
            box-shadow: 0 0 0 2px var(--pink), 0 4px 8px rgba(0,0,0,0.2);
            z-index: 2;
        }
        
        .color-picker {
            min-width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px dashed #ccc;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }
        
        .color-picker input[type="color"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        
        .actions-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1.5fr;
            gap: 8px;
            padding-top: 4px;
        }
        
        .action-btn {
            padding: 12px 8px;
            border-radius: 12px;
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        
        .action-btn:active { transform: scale(0.96); }
        
        .btn-undo { background: #F0F0F0; color: var(--text); }
        .btn-clear { background: #FFE5E5; color: #FF4444; }
        .btn-done {
            background: linear-gradient(135deg, #FF6B9D, #9B59B6);
            color: white;
            box-shadow: 0 4px 12px rgba(255,107,157,0.3);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .modal.open { display: flex; }
        
        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            animation: popIn 0.3s ease-out;
        }
        
        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        .modal-emoji {
            font-size: 64px;
            margin-bottom: 12px;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        
        .modal-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .modal-sub {
            font-size: 14px;
            color: var(--hint);
            margin-bottom: 20px;
        }
        
        .points-earned {
            background: linear-gradient(135deg, #FFF5F8, #FFE5F0);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
        }
        
        .points-value {
            font-size: 32px;
            font-weight: 800;
            color: var(--pink);
        }
        
        .points-label { font-size: 13px; color: var(--hint); }
        
        .modal-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #FF6B9D, #9B59B6);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .modal-btn:active { transform: scale(0.97); }
        
        .modal-btn-outline {
            background: transparent;
            color: var(--text);
            border: 2px solid #eee;
        }
        
        .modal-btn-secondary {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: var(--hint);
            border: none;
            font-size: 13px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="back-btn" onclick="goBack()">←</button>
        <div class="top-bar-info">
            <div class="theme-label">📅 Тема дня</div>
            <div class="theme-text" id="themeText">Загрузка...</div>
        </div>
        <button class="icon-btn" onclick="showHint()">💡</button>
    </div>
    
    <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="drawingCanvas"></canvas>
        <div class="hint-bubble" id="hintBubble"></div>
    </div>
    
    <div class="tools">
        <div class="tools-top">
            <div class="size-slider">
                <div class="size-preview" id="sizePreview"></div>
                <input type="range" id="sizeSlider" min="1" max="5" value="2" step="1">
            </div>
            <button class="quick-btn" onclick="loadImage()" title="Загрузить">📁</button>
            <button class="quick-btn" onclick="saveImage()" title="Сохранить">💾</button>
        </div>
        
        <div class="brushes-row" id="brushesRow"></div>
        <div class="colors-row" id="colorsRow"></div>
        
        <div class="actions-row">
            <button class="action-btn btn-undo" onclick="undo()">↶</button>
            <button class="action-btn btn-clear" onclick="clearCanvas()">🗑</button>
            <button class="action-btn btn-done" onclick="finishDrawing()">✓ Готово</button>
        </div>
    </div>
    
    <div class="modal" id="successModal">
        <div class="modal-content">
            <div class="modal-emoji">🎉</div>
            <div class="modal-title">Отличный рисунок!</div>
            <div class="modal-sub" id="modalSub">Ты нарисовал(а) рисунок дня</div>
            <div class="points-earned">
                <div class="points-value">+10</div>
                <div class="points-label">баллов</div>
            </div>
            
            <button class="modal-btn" onclick="saveImage()">
                💾 Сохранить на телефон
            </button>
            <button class="modal-btn modal-btn-outline" onclick="location.href='../index.html'">
                🏠 На главную
            </button>
            <button class="modal-btn-secondary" onclick="continueDrawing()">
                ✏️ Нарисовать ещё
            </button>
        </div>
    </div>
    
    <script src="../shared/data/themes.js"></script>
    <script src="../shared/js/storage.js"></script>
    
    <script>
        let tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#FF6B9D');
            tg.setBackgroundColor('#FFF5F8');
            if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
        }
        
        function goBack() {
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            if (confirm('Выйти? Рисунок не сохранится.')) {
                location.href = '../index.html';
            }
        }
        
        const todayTheme = getTodayTheme();
        document.getElementById('themeText').textContent = todayTheme.emoji + ' ' + todayTheme.text;
        
        function showHint() {
            const bubble = document.getElementById('hintBubble');
            bubble.textContent = '💡 ' + todayTheme.hint;
            bubble.classList.add('show');
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            setTimeout(() => bubble.classList.remove('show'), 3000);
        }
        
        // ========== КИСТИ ==========
        const BRUSHES = [
            { id: 'pencil', name: 'Карандаш', icon: '✏️', baseSize: 1, opacity: 0.7, mode: 'pencil' },
            { id: 'pen', name: 'Ручка', icon: '🖊', baseSize: 2, opacity: 1, mode: 'pen' },
            { id: 'marker', name: 'Маркер', icon: '🖍', baseSize: 10, opacity: 0.85, mode: 'marker' },
            { id: 'brush', name: 'Кисть', icon: '🖌', baseSize: 8, opacity: 0.9, mode: 'brush' },
            { id: 'watercolor', name: 'Акварель', icon: '💧', baseSize: 20, opacity: 0.25, mode: 'watercolor' },
            { id: 'oil', name: 'Масло', icon: '🖼', baseSize: 12, opacity: 0.95, mode: 'oil' },
            { id: 'rainbow', name: 'Радуга', icon: '🌈', baseSize: 10, opacity: 0.9, mode: 'rainbow' },
            { id: 'charcoal', name: 'Уголь', icon: '⚫️', baseSize: 6, opacity: 0.6, mode: 'charcoal' },
            { id: 'spray', name: 'Спрей', icon: '💨', baseSize: 16, opacity: 0.5, mode: 'spray' },
            { id: 'stars', name: 'Звёзды', icon: '✨', baseSize: 12, opacity: 1, mode: 'stars' },
            { id: 'firework', name: 'Фейерверк', icon: '🎆', baseSize: 14, opacity: 0.9, mode: 'firework' },
            { id: 'smoke', name: 'Дымка', icon: '🌫', baseSize: 24, opacity: 0.15, mode: 'smoke' },
            { id: 'drops', name: 'Капли', icon: '🍯', baseSize: 10, opacity: 0.7, mode: 'drops' },
            { id: 'petals', name: 'Цветение', icon: '🌸', baseSize: 8, opacity: 0.85, mode: 'petals' },
            { id: 'neon', name: 'Неон', icon: '💡', baseSize: 4, opacity: 1, mode: 'neon' },
            { id: 'eraser', name: 'Ластик', icon: '🧽', baseSize: 16, opacity: 1, mode: 'eraser' }
        ];
        
        const COLORS = [
            '#000000', '#FFFFFF', '#808080',
            '#FF0000', '#FF6B00', '#FFD700', '#FFEB3B',
            '#4CAF50', '#8BC34A', '#00BCD4', '#2196F3',
            '#3F51B5', '#9C27B0', '#E91E63', '#795548',
            '#8B4513', '#FFB6C1', '#FFE4B5'
        ];
        
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        
        let currentBrush = BRUSHES[0];
        let currentColor = '#000000';
        let currentSizeLevel = 2;
        let isDrawing = false;
        let history = [];
        let maxHistory = 25;
        let canvasSize = 0;
        let dpr = 1;
        let lastPoint = null;
        let sprayInterval = null;
        let rainbowHue = 0;
        
        function initCanvas() {
            const wrapper = document.getElementById('canvasWrapper');
            const rect = wrapper.getBoundingClientRect();
            
            canvasSize = Math.min(rect.width - 16, rect.height - 16);
            dpr = window.devicePixelRatio || 1;
            
            canvas.style.width = canvasSize + 'px';
            canvas.style.height = canvasSize + 'px';
            canvas.width = canvasSize * dpr;
            canvas.height = canvasSize * dpr;
            
            ctx.scale(dpr, dpr);
            
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvasSize, canvasSize);
        }
        
        function applyBrushSettings() {
            const size = currentBrush.baseSize * currentSizeLevel;
            
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.globalAlpha = currentBrush.opacity;
            ctx.lineWidth = size;
            ctx.strokeStyle = currentColor;
            ctx.fillStyle = currentColor;
            
            if (currentBrush.mode === 'neon') {
                ctx.shadowBlur = 20;
                ctx.shadowColor = currentColor;
                ctx.lineWidth = size * 1.5;
            }
            
            if (currentBrush.mode === 'eraser') {
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = size * 2;
            }
        }
        
        function getPosition(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;
            
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            
            return {
                x: (clientX - rect.left) / (rect.width / canvasSize),
                y: (clientY - rect.top) / (rect.height / canvasSize)
            };
        }
        
        function startDrawing(e) {
            e.preventDefault();
            isDrawing = true;
            saveHistory();
            
            const pos = getPosition(e);
            lastPoint = pos;
            
            if (currentBrush.mode === 'spray') {
                drawSpray(pos);
                sprayInterval = setInterval(() => {
                    if (lastPoint) drawSpray(lastPoint);
                }, 50);
                return;
            }
            
            if (['stars', 'firework', 'drops', 'petals', 'smoke'].includes(currentBrush.mode)) {
                drawTexturePoint(pos);
                return;
            }
            
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, ctx.lineWidth / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            
            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }
        
        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            
            const pos = getPosition(e);
            
            if (['stars', 'firework', 'drops', 'petals', 'smoke'].includes(currentBrush.mode)) {
                drawTexturePoint(pos);
                lastPoint = pos;
                return;
            }
            
            if (currentBrush.mode === 'spray') {
                lastPoint = pos;
                return;
            }
            
            if (currentBrush.mode === 'rainbow') {
                rainbowHue = (rainbowHue + 3) % 360;
                ctx.strokeStyle = `hsl(${rainbowHue}, 100%, 50%)`;
            }
            
            if (currentBrush.mode === 'watercolor' && lastPoint) {
                drawWatercolor(lastPoint, pos);
                lastPoint = pos;
                return;
            }
            
            if (currentBrush.mode === 'charcoal' && lastPoint) {
                drawCharcoal(lastPoint, pos);
                lastPoint = pos;
                return;
            }
            
            if (currentBrush.mode === 'oil' && lastPoint) {
                drawOil(lastPoint, pos);
                lastPoint = pos;
                return;
            }
            
            if (currentBrush.mode === 'pencil' && lastPoint) {
                drawPencil(lastPoint, pos);
                lastPoint = pos;
                return;
            }
            
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            lastPoint = pos;
        }
        
        function stopDrawing(e) {
            if (!isDrawing) return;
            isDrawing = false;
            lastPoint = null;
            ctx.closePath();
            
            if (sprayInterval) {
                clearInterval(sprayInterval);
                sprayInterval = null;
            }
        }
        
        function drawSpray(pos) {
            const density = currentSizeLevel * 12;
            const radius = currentBrush.baseSize * currentSizeLevel * 1.5;
            
            ctx.fillStyle = currentColor;
            ctx.globalAlpha = currentBrush.opacity;
            
            for (let i = 0; i < density; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * radius;
                const x = pos.x + Math.cos(angle) * dist;
                const y = pos.y + Math.sin(angle) * dist;
                const size = Math.random() * 1.5 + 0.5;
                
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function drawWatercolor(from, to) {
            const spread = currentBrush.baseSize * currentSizeLevel * 0.8;
            for (let i = 0; i < 5; i++) {
                const offsetX = (Math.random() - 0.5) * spread;
                const offsetY = (Math.random() - 0.5) * spread;
                
                ctx.beginPath();
                ctx.moveTo(from.x + offsetX, from.y + offsetY);
                ctx.lineTo(to.x + offsetX, to.y + offsetY);
                ctx.stroke();
            }
        }
        
        function drawCharcoal(from, to) {
            for (let i = 0; i < 3; i++) {
                ctx.globalAlpha = 0.2;
                ctx.lineWidth = currentBrush.baseSize * currentSizeLevel * (1 + i * 0.5);
                
                const jitterX = (Math.random() - 0.5) * 4;
                const jitterY = (Math.random() - 0.5) * 4;
                
                ctx.beginPath();
                ctx.moveTo(from.x + jitterX, from.y + jitterY);
                ctx.lineTo(to.x + jitterX, to.y + jitterY);
                ctx.stroke();
            }
            ctx.globalAlpha = currentBrush.opacity;
            ctx.lineWidth = currentBrush.baseSize * currentSizeLevel;
        }
        
        function drawOil(from, to) {
            const length = currentBrush.baseSize * currentSizeLevel * 1.5;
            const count = 3;
            
            for (let i = 0; i < count; i++) {
                const angle = Math.atan2(to.y - from.y, to.x - from.x);
                const perpAngle = angle + Math.PI / 2;
                const offset = (i - count / 2) * 3;
                
                const startX = from.x + Math.cos(perpAngle) * offset;
                const startY = from.y + Math.sin(perpAngle) * offset;
                const endX = startX + Math.cos(angle) * length * 0.3;
                const endY = startY + Math.sin(angle) * length * 0.3;
                
                ctx.globalAlpha = 0.7 + Math.random() * 0.3;
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(endX, endY);
                ctx.stroke();
            }
            ctx.globalAlpha = currentBrush.opacity;
        }
        
        function drawPencil(from, to) {
            for (let i = 0; i < 4; i++) {
                const offsetX = (Math.random() - 0.5) * 2;
                const offsetY = (Math.random() - 0.5) * 2;
                
                ctx.globalAlpha = 0.3 + Math.random() * 0.3;
                ctx.lineWidth = 0.5;
                
                ctx.beginPath();
                ctx.moveTo(from.x + offsetX, from.y + offsetY);
                ctx.lineTo(to.x + offsetX, to.y + offsetY);
                ctx.stroke();
            }
            ctx.globalAlpha = currentBrush.opacity;
            ctx.lineWidth = currentBrush.baseSize * currentSizeLevel;
        }
        
        // ========== ТЕКСТУРНЫЕ КИСТИ ==========
        function drawTexturePoint(pos) {
            const mode = currentBrush.mode;
            const size = currentBrush.baseSize * currentSizeLevel * 0.8;
            
            switch (mode) {
                case 'stars': drawStars(pos, size); break;
                case 'firework': drawFirework(pos, size); break;
                case 'drops': drawDrops(pos, size); break;
                case 'petals': drawPetals(pos, size); break;
                case 'smoke': drawSmoke(pos, size); break;
            }
        }
        
        // ⭐️ Звёздочки
        function drawStars(pos, size) {
            const count = 1 + Math.floor(Math.random() * 2);
            
            for (let i = 0; i < count; i++) {
                const offsetX = (Math.random() - 0.5) * size * 1.5;
                const offsetY = (Math.random() - 0.5) * size * 1.5;
                const starSize = size * (0.7 + Math.random() * 0.6);
                const rotation = Math.random() * Math.PI * 2;
                
                ctx.save();
                ctx.translate(pos.x + offsetX, pos.y + offsetY);
                ctx.rotate(rotation);
                ctx.fillStyle = currentColor;
                ctx.globalAlpha = 0.9 + Math.random() * 0.1;
                
                const spikes = 5;
                const outerR = starSize;
                const innerR = starSize * 0.45;
                
                let rot = Math.PI / 2 * 3;
                const step = Math.PI / spikes;
                
                ctx.beginPath();
                ctx.moveTo(0, -outerR);
                
                for (let s = 0; s < spikes; s++) {
                    ctx.lineTo(Math.cos(rot) * outerR, Math.sin(rot) * outerR);
                    rot += step;
                    ctx.lineTo(Math.cos(rot) * innerR, Math.sin(rot) * innerR);
                    rot += step;
                }
                
                ctx.closePath();
                ctx.fill();
                
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.beginPath();
                ctx.arc(-starSize * 0.15, -starSize * 0.15, starSize * 0.15, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }
        
        // 🎆 Фейерверк
        function drawFirework(pos, size) {
            const particles = 8 + Math.floor(Math.random() * 8);
            const radius = size * 1.5;
            
            for (let i = 0; i < particles; i++) {
                const angle = (Math.PI * 2 / particles) * i + Math.random() * 0.3;
                const dist = radius * (0.5 + Math.random() * 0.5);
                const x = pos.x + Math.cos(angle) * dist;
                const y = pos.y + Math.sin(angle) * dist;
                const particleSize = size * (0.2 + Math.random() * 0.3);
                
                const hue = (i * 40 + Date.now() / 10) % 360;
                ctx.fillStyle = `hsl(${hue}, 100%, 55%)`;
                ctx.globalAlpha = 0.7 + Math.random() * 0.3;
                
                ctx.beginPath();
                ctx.arc(x, y, particleSize, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.shadowBlur = 8;
                ctx.shadowColor = `hsl(${hue}, 100%, 60%)`;
                ctx.beginPath();
                ctx.arc(x, y, particleSize * 0.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            
            ctx.globalAlpha = currentBrush.opacity;
        }
        
        // 🍯 Капли
        function drawDrops(pos, size) {
            const count = 1 + Math.floor(Math.random() * 3);
            
            for (let i = 0; i < count; i++) {
                const offsetX = (Math.random() - 0.5) * size * 2;
                const offsetY = (Math.random() - 0.5) * size * 2;
                const dropSize = size * (0.4 + Math.random() * 0.6);
                
                ctx.fillStyle = currentColor;
                ctx.globalAlpha = 0.6 + Math.random() * 0.4;
                
                ctx.beginPath();
                ctx.arc(pos.x + offsetX, pos.y + offsetY, dropSize, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.globalAlpha = 0.6;
                ctx.beginPath();
                ctx.arc(
                    pos.x + offsetX - dropSize * 0.3,
                    pos.y + offsetY - dropSize * 0.3,
                    dropSize * 0.3,
                    0, Math.PI * 2
                );
                ctx.fill();
                
                ctx.strokeStyle = currentColor;
                ctx.globalAlpha = 0.8;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(pos.x + offsetX, pos.y + offsetY, dropSize, 0, Math.PI * 2);
                ctx.stroke();
            }
            
            ctx.globalAlpha = currentBrush.opacity;
        }
        
        // 🌸 Цветение
        function drawPetals(pos, size) {
            const count = 1 + Math.floor(Math.random() * 2);
            
            for (let i = 0; i < count; i++) {
                const offsetX = (Math.random() - 0.5) * size * 1.5;
                const offsetY = (Math.random() - 0.5) * size * 1.5;
                const petalSize = size * (0.6 + Math.random() * 0.5);
                const rotation = Math.random() * Math.PI * 2;
                
                ctx.save();
                ctx.translate(pos.x + offsetX, pos.y + offsetY);
                ctx.rotate(rotation);
                ctx.fillStyle = currentColor;
                ctx.globalAlpha = 0.7 + Math.random() * 0.3;
                
                ctx.beginPath();
                ctx.ellipse(0, 0, petalSize, petalSize * 0.5, 0, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 0.8;
                ctx.beginPath();
                ctx.moveTo(-petalSize * 0.7, 0);
                ctx.lineTo(petalSize * 0.7, 0);
                ctx.stroke();
                
                ctx.restore();
            }
            
            ctx.globalAlpha = currentBrush.opacity;
        }
        
        // 🌫 Дымка
        function drawSmoke(pos, size) {
            const layers = 3 + Math.floor(Math.random() * 3);
            const radius = size * (1.5 + Math.random());
            
            for (let i = 0; i < layers; i++) {
                const offsetX = (Math.random() - 0.5) * size * 2;
                const offsetY = (Math.random() - 0.5) * size * 2;
                const layerSize = radius * (0.5 + Math.random() * 0.5);
                
                const gradient = ctx.createRadialGradient(
                    pos.x + offsetX, pos.y + offsetY, 0,
                    pos.x + offsetX, pos.y + offsetY, layerSize
                );
                
                gradient.addColorStop(0, currentColor);
                gradient.addColorStop(1, 'rgba(255,255,255,0)');
                
                ctx.fillStyle = gradient;
                ctx.globalAlpha = 0.08 + Math.random() * 0.12;
                
                ctx.beginPath();
                ctx.arc(pos.x + offsetX, pos.y + offsetY, layerSize, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.globalAlpha = currentBrush.opacity;
        }
        
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);
        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);
        canvas.addEventListener('touchcancel', stopDrawing);
        
        function saveHistory() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            history.push(imageData);
            if (history.length > maxHistory) history.shift();
        }
        
        function undo() {
            if (history.length === 0) return;
            const imageData = history.pop();
            ctx.putImageData(imageData, 0, 0);
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }
        
        function clearCanvas() {
            if (!confirm('Очистить рисунок?')) return;
            saveHistory();
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvasSize, canvasSize);
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }
        
        function renderBrushes() {
            const container = document.getElementById('brushesRow');
            container.innerHTML = BRUSHES.map(b => `
                <button class="brush-btn ${b.id === currentBrush.id ? 'active' : ''}"
                        onclick="selectBrush('${b.id}')"
                        title="${b.name}">
                    ${b.icon}
                </button>
            `).join('');
        }
        
        function selectBrush(id) {
            currentBrush = BRUSHES.find(b => b.id === id);
            applyBrushSettings();
            renderBrushes();
            updateSizePreview();
            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }
        
        function renderColors() {
            const container = document.getElementById('colorsRow');
            let html = COLORS.map(c => `
                <button class="color-btn ${c === currentColor ? 'active' : ''}"
                        style="background: ${c}"
                        onclick="selectColor('${c}')">
                </button>
            `).join('');
            
            html += `
                <div class="color-picker">
                    🎨
                    <input type="color" value="${currentColor}" onchange="selectColor(this.value)">
                </div>
            `;
            
            container.innerHTML = html;
        }
        
        function selectColor(color) {
            currentColor = color;
            if (currentBrush.mode !== 'eraser' && currentBrush.mode !== 'rainbow') {
                ctx.strokeStyle = color;
                ctx.fillStyle = color;
            }
            renderColors();
            updateSizePreview();
            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }
        
        function updateSizePreview() {
            const preview = document.getElementById('sizePreview');
            const sizes = [4, 6, 10, 16, 24];
            const size = sizes[currentSizeLevel - 1];
            
            preview.style.width = size + 'px';
            preview.style.height = size + 'px';
            preview.style.background = currentBrush.mode === 'eraser' ? '#ddd' : currentColor;
        }
        
        document.getElementById('sizeSlider').addEventListener('input', (e) => {
            currentSizeLevel = parseInt(e.target.value);
            applyBrushSettings();
            updateSizePreview();
        });
        
        // ========== ЗАГРУЗКА КАРТИНКИ (100% НЕПРОЗРАЧНОСТЬ) ==========
        function loadImage() {
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        saveHistory();
                        
                        const canvasRatio = canvasSize / canvasSize;
                        const imgRatio = img.width / img.height;
                        
                        let drawWidth, drawHeight, offsetX = 0, offsetY = 0;
                        
                        if (imgRatio > canvasRatio) {
                            drawWidth = canvasSize;
                            drawHeight = canvasSize / imgRatio;
                            offsetY = (canvasSize - drawHeight) / 2;
                        } else {
                            drawHeight = canvasSize;
                            drawWidth = canvasSize * imgRatio;
                            offsetX = (canvasSize - drawWidth) / 2;
                        }
                        
                        // ✅ ИСПРАВЛЕНО: 100% непрозрачность
                        ctx.globalAlpha = 1;
                        ctx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);
                        ctx.globalAlpha = currentBrush.opacity;
                        
                        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };
            
            input.click();
        }
        
        // ========== СОХРАНЕНИЕ ==========
        function saveImage() {
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            
            try {
                const dataURL = canvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.download = `рисовашка_${todayTheme.text.replace(/\s+/g, '_')}_${Date.now()}.png`;
                link.href = dataURL;
                link.click();
                if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } catch (e) {
                console.error('Save error:', e);
                alert('Не удалось сохранить.');
            }
        }
        
        // ========== ЗАВЕРШЕНИЕ ==========
        function finishDrawing() {
            const imageData = canvas.toDataURL('image/png');
            
            Storage.addBalance(10);
            const streak = Storage.updateStreak();
            
            const drawing = Storage.saveDrawing({
                theme: todayTheme.text,
                themeEmoji: todayTheme.emoji,
                image: imageData
            });
            
            if (streak > 1 && streak % 7 === 0) {
                Storage.addBalance(50);
                if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            }
            
            document.getElementById('modalSub').textContent =
                `Ты нарисовал(а) «${todayTheme.text}»`;
            
            document.getElementById('successModal').classList.add('open');
            document.getElementById('successModal').dataset.drawingId = drawing.id;
            
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }
        
        function continueDrawing() {
            document.getElementById('successModal').classList.remove('open');
            history = [];
            clearCanvas();
        }
        
        window.addEventListener('load', () => {
            initCanvas();
            applyBrushSettings();
            renderBrushes();
            renderColors();
            updateSizePreview();
        });
        
        setTimeout(() => showHint(), 1500);
        
        console.log('🎨 16 кистей загружено');
    </script>
</body>
</html>
