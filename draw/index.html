<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="telegram-web-app-capable" content="yes">
    <title>Рисуем — Рисовашка</title>
    <style>
        :root {
            --pink: #FF6B9D;
            --purple: #9B59B6;
            --blue: #4ECDC4;
            --bg: #FFF5F8;
            --text: #2C3E50;
            --hint: #999999;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            max-width: 480px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: var(--text);
            touch-action: none;
        }
        
        /* ========== ШАПКА ========== */
        .top-bar {
            background: linear-gradient(135deg, #FF6B9D, #9B59B6);
            color: white;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        
        .back-btn, .icon-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .top-bar-info { flex: 1; min-width: 0; }
        
        .theme-label { font-size: 10px; opacity: 0.85; margin-bottom: 2px; }
        
        .theme-text {
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* ========== ХОЛСТ ========== */
        .canvas-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            position: relative;
            min-height: 0;
            background: #E8E8E8;
        }
        
        #drawingCanvas {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            touch-action: none;
            cursor: crosshair;
            max-width: 100%;
            max-height: 100%;
            display: block;
        }
        
        .hint-bubble {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 5;
            max-width: 90%;
            text-align: center;
        }
        
        .hint-bubble.show { opacity: 1; }
        
        /* ========== ИНСТРУМЕНТЫ ========== */
        .tools {
            background: white;
            border-top: 1px solid #eee;
            padding: 8px 10px 12px;
            flex-shrink: 0;
        }
        
        /* Размер + быстрые действия */
        .tools-top {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        
        .size-slider {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #F5F5F5;
            padding: 6px 12px;
            border-radius: 20px;
        }
        
        .size-preview {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            flex-shrink: 0;
            transition: all 0.15s;
        }
        
        #sizeSlider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            background: #ddd;
            border-radius: 2px;
            outline: none;
        }
        
        #sizeSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #FF6B9D, #9B59B6);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(255,107,157,0.4);
        }
        
        #sizeSlider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #FF6B9D, #9B59B6);
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }
        
        .quick-btn {
            background: #F5F5F5;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            flex-shrink: 0;
        }
        
        .quick-btn:active { transform: scale(0.9); }
        
        /* Кисти */
        .brushes-row {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 8px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        
        .brushes-row::-webkit-scrollbar { display: none; }
        
        .brush-btn {
            min-width: 48px;
            height: 48px;
            border-radius: 12px;
            border: 2px solid transparent;
            background: #F5F5F5;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .brush-btn.active {
            border-color: var(--pink);
            background: #FFE5F0;
            transform: scale(1.05);
        }
        
        .brush-btn:active { transform: scale(0.92); }
        
        /* Цвета */
        .colors-row {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 8px;
            -webkit-overflow-scrolling: touch;
            align-items: center;
            scrollbar-width: none;
        }
        
        .colors-row::-webkit-scrollbar { display: none; }
        
        .color-btn {
            min-width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: all 0.15s;
            flex-shrink: 0;
        }
        
        .color-btn.active {
            transform: scale(1.3);
            box-shadow: 0 0 0 2px var(--pink), 0 4px 8px rgba(0,0,0,0.2);
            z-index: 2;
        }
        
        .color-picker {
            min-width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px dashed #ccc;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }
        
        .color-picker input[type="color"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        
        /* Действия */
        .actions-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1.5fr;
            gap: 8px;
            padding-top: 4px;
        }
        
        .action-btn {
            padding: 12px 8px;
            border-radius: 12px;
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        
        .action-btn:active { transform: scale(0.96); }
        
        .btn-undo { background: #F0F0F0; color: var(--text); }
        .btn-clear { background: #FFE5E5; color: #FF4444; }
        .btn-done {
            background: linear-gradient(135deg, #FF6B9D, #9B59B6);
            color: white;
            box-shadow: 0 4px 12px rgba(255,107,157,0.3);
        }
        
        /* ========== МОДАЛКИ ========== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .modal.open { display: flex; }
        
        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            animation: popIn 0.3s ease-out;
        }
        
        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        .modal-emoji {
            font-size: 64px;
            margin-bottom: 12px;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        
        .modal-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .modal-sub {
            font-size: 14px;
            color: var(--hint);
            margin-bottom: 20px;
        }
        
        .points-earned {
            background: linear-gradient(135deg, #FFF5F8, #FFE5F0);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
        }
        
        .points-value {
            font-size: 32px;
            font-weight: 800;
            color: var(--pink);
        }
        
        .points-label { font-size: 13px; color: var(--hint); }
        
        .modal-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #FF6B9D, #9B59B6);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .modal-btn:active { transform: scale(0.97); }
        
        .modal-btn-outline {
            background: transparent;
            color: var(--text);
            border: 2px solid #eee;
        }
        
        .modal-btn-secondary {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: var(--hint);
            border: none;
            font-size: 13px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- ШАПКА -->
    <div class="top-bar">
        <button class="back-btn" onclick="goBack()">←</button>
        <div class="top-bar-info">
            <div class="theme-label">📅 Тема дня</div>
            <div class="theme-text" id="themeText">Загрузка...</div>
        </div>
        <button class="icon-btn" onclick="showHint()" title="Подсказка">💡</button>
    </div>
    
    <!-- ХОЛСТ -->
    <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="drawingCanvas"></canvas>
        <div class="hint-bubble" id="hintBubble"></div>
    </div>
    
    <!-- ИНСТРУМЕНТЫ -->
    <div class="tools">
        <!-- Размер + загрузка/сохранение -->
        <div class="tools-top">
            <div class="size-slider">
                <div class="size-preview" id="sizePreview"></div>
                <input type="range" id="sizeSlider" min="1" max="5" value="2" step="1">
            </div>
            <button class="quick-btn" onclick="loadImage()" title="Загрузить картинку">📁</button>
            <button class="quick-btn" onclick="saveImage()" title="Сохранить">💾</button>
        </div>
        
        <!-- Кисти -->
        <div class="brushes-row" id="brushesRow"></div>
        
        <!-- Цвета -->
        <div class="colors-row" id="colorsRow"></div>
        
        <!-- Действия -->
        <div class="actions-row">
            <button class="action-btn btn-undo" onclick="undo()">↶</button>
            <button class="action-btn btn-clear" onclick="clearCanvas()">🗑</button>
            <button class="action-btn btn-done" onclick="finishDrawing()">✓ Готово</button>
        </div>
    </div>
    
    <!-- МОДАЛКА ФИНАЛА -->
    <div class="modal" id="successModal">
        <div class="modal-content">
            <div class="modal-emoji">🎉</div>
            <div class="modal-title">Отличный рисунок!</div>
            <div class="modal-sub" id="modalSub">Ты нарисовал(а) рисунок дня</div>
            <div class="points-earned">
                <div class="points-value">+10</div>
                <div class="points-label">баллов</div>
            </div>
            
            <button class="modal-btn" onclick="saveImage()">
                💾 Сохранить на телефон
            </button>
            
            <button class="modal-btn modal-btn-outline" onclick="location.href='../index.html'">
                🏠 На главную
            </button>
            
            <button class="modal-btn-secondary" onclick="continueDrawing()">
                ✏️ Нарисовать ещё
            </button>
        </div>
    </div>
    
    <!-- ДАННЫЕ -->
    <script src="../shared/data/themes.js"></script>
    <script src="../shared/js/storage.js"></script>
    
    <!-- ЛОГИКА -->
    <script>
        // ========== TELEGRAM ==========
        let tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#FF6B9D');
            tg.setBackgroundColor('#FFF5F8');
            if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
        }
        
        function goBack() {
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            if (confirm('Выйти? Рисунок не сохранится.')) {
                location.href = '../index.html';
            }
        }
        
        // ========== ТЕМА ДНЯ ==========
        const todayTheme = getTodayTheme();
        document.getElementById('themeText').textContent = todayTheme.emoji + ' ' + todayTheme.text;
        
        function showHint() {
            const bubble = document.getElementById('hintBubble');
            bubble.textContent = '💡 ' + todayTheme.hint;
            bubble.classList.add('show');
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            setTimeout(() => bubble.classList.remove('show'), 3000);
        }
        
        // ========== КИСТИ С РЕАЛЬНО РАЗНОЙ ТЕКСТУРОЙ ==========
        const BRUSHES = [
            {
                id: 'pencil',
                name: 'Карандаш',
                icon: '✏️',
                baseSize: 1,
                opacity: 0.7,
                mode: 'pencil' // тонкая полупрозрачная серая
            },
            {
                id: 'pen',
                name: 'Ручка',
                icon: '🖊',
                baseSize: 2,
                opacity: 1,
                mode: 'pen' // чёткая тонкая
            },
            {
                id: 'marker',
                name: 'Маркер',
                icon: '🖍',
                baseSize: 10,
                opacity: 0.85,
                mode: 'marker' // широкая полупрозрачная
            },
            {
                id: 'brush',
                name: 'Кисть',
                icon: '🖌',
                baseSize: 8,
                opacity: 0.9,
                mode: 'brush' // мягкие мазки
            },
            {
                id: 'watercolor',
                name: 'Акварель',
                icon: '💧',
                baseSize: 20,
                opacity: 0.25,
                mode: 'watercolor' // растекание
            },
            {
                id: 'gouache',
                name: 'Гуашь',
                icon: '🎨',
                baseSize: 14,
                opacity: 1,
                mode: 'gouache' // плотная матовая
            },
            {
                id: 'oil',
                name: 'Масло',
                icon: '🖼',
                baseSize: 12,
                opacity: 0.95,
                mode: 'oil' // текстура мазками
            },
            {
                id: 'pastel',
                name: 'Радуга',
                icon: '🌈',
                baseSize: 10,
                opacity: 0.9,
                mode: 'rainbow' // меняет цвет
            },
            {
                id: 'charcoal',
                name: 'Уголь',
                icon: '⚫️',
                baseSize: 6,
                opacity: 0.6,
                mode: 'charcoal' // растушёвка
            },
            {
                id: 'spray',
                name: 'Спрей',
                icon: '💨',
                baseSize: 16,
                opacity: 0.5,
                mode: 'spray' // распыление
            },
            {
                id: 'stars',
                name: 'Звёзды',
                icon: '✨',
                baseSize: 12,
                opacity: 1,
                mode: 'stars' // звёздочки!
            },
            {
                id: 'bubbles',
                name: 'Пузыри',
                icon: '🫧',
                baseSize: 14,
                opacity: 0.7,
                mode: 'bubbles' // кружки
            },
            {
                id: 'leaves',
                name: 'Листья',
                icon: '🍃',
                baseSize: 14,
                opacity: 0.9,
                mode: 'leaves' // листики
            },
            {
                id: 'snow',
                name: 'Снежинки',
                icon: '❄️',
                baseSize: 12,
                opacity: 0.9,
                mode: 'snow' // снежинки
            },
            {
                id: 'neon',
                name: 'Неон',
                icon: '💡',
                baseSize: 4,
                opacity: 1,
                mode: 'neon' // светящаяся
            },
            {
                id: 'eraser',
                name: 'Ластик',
                icon: '🧽',
                baseSize: 16,
                opacity: 1,
                mode: 'eraser'
            }
        ];
        
        const COLORS = [
            '#000000', '#FFFFFF', '#808080',
            '#FF0000', '#FF6B00', '#FFD700', '#FFEB3B',
            '#4CAF50', '#8BC34A', '#00BCD4', '#2196F3',
            '#3F51B5', '#9C27B0', '#E91E63', '#795548',
            '#8B4513', '#FFB6C1', '#FFE4B5'
        ];
        
        // ========== СОСТОЯНИЕ ==========
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        
        let currentBrush = BRUSHES[0];
        let currentColor = '#000000';
        let currentSizeLevel = 2;
        let isDrawing = false;
        let history = [];
        let maxHistory = 25;
        let canvasSize = 0;
        let dpr = 1;
        let lastPoint = null;
        let sprayInterval = null;
        let rainbowHue = 0;
        
        // ========== ИНИЦИАЛИЗАЦИЯ CANVAS ==========
        function initCanvas() {
            const wrapper = document.getElementById('canvasWrapper');
            const rect = wrapper.getBoundingClientRect();
            
            canvasSize = Math.min(rect.width - 16, rect.height - 16);
            dpr = window.devicePixelRatio || 1;
            
            canvas.style.width = canvasSize + 'px';
            canvas.style.height = canvasSize + 'px';
            canvas.width = canvasSize * dpr;
            canvas.height = canvasSize * dpr;
            
            ctx.scale(dpr, dpr);
            
            // Белый фон
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvasSize, canvasSize);
        }
        
        // ========== НАСТРОЙКИ КИСТИ ==========
        function applyBrushSettings() {
            const size = currentBrush.baseSize * currentSizeLevel;
            
            // Сброс
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.globalAlpha = currentBrush.opacity;
            ctx.lineWidth = size;
            ctx.strokeStyle = currentColor;
            ctx.fillStyle = currentColor;
            
            // Особые настройки по режиму
            if (currentBrush.mode === 'neon') {
                ctx.shadowBlur = 20;
                ctx.shadowColor = currentColor;
                ctx.lineWidth = size * 1.5;
            }
            
            if (currentBrush.mode === 'eraser') {
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = size * 2;
            }
        }
        
        // ========== ПОЗИЦИЯ ==========
        function getPosition(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;
            
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            
            return {
                x: (clientX - rect.left) / (rect.width / canvasSize),
                y: (clientY - rect.top) / (rect.height / canvasSize)
            };
        }
        
        // ========== РИСОВАНИЕ ==========
        function startDrawing(e) {
            e.preventDefault();
            isDrawing = true;
            saveHistory();
            
            const pos = getPosition(e);
            lastPoint = pos;
            
            // Спрей — интервал
            if (currentBrush.mode === 'spray') {
                drawSpray(pos);
                sprayInterval = setInterval(() => {
                    if (lastPoint) drawSpray(lastPoint);
                }, 50);
                return;
            }
            
            // Точечные кисти — сразу рисуем
            if (['stars', 'bubbles', 'leaves', 'snow'].includes(currentBrush.mode)) {
                drawPointTexture(pos);
                return;
            }
            
            // Обычная точка в начале
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, ctx.lineWidth / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            
            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }
        
        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            
            const pos = getPosition(e);
            
            // Точечные текстуры
            if (['stars', 'bubbles', 'leaves', 'snow'].includes(currentBrush.mode)) {
                drawPointTexture(pos);
                lastPoint = pos;
                return;
            }
            
            // Спрей
            if (currentBrush.mode === 'spray') {
                lastPoint = pos;
                return;
            }
            
            // Радуга — меняем цвет
            if (currentBrush.mode === 'rainbow') {
                rainbowHue = (rainbowHue + 3) % 360;
                ctx.strokeStyle = `hsl(${rainbowHue}, 100%, 50%)`;
            }
            
            // Акварель — растекание
            if (currentBrush.mode === 'watercolor' && lastPoint) {
                drawWatercolor(lastPoint, pos);
                lastPoint = pos;
                return;
            }
            
            // Уголь — растушёвка
            if (currentBrush.mode === 'charcoal' && lastPoint) {
                drawCharcoal(lastPoint, pos);
                lastPoint = pos;
                return;
            }
            
            // Масло — текстура
            if (currentBrush.mode === 'oil' && lastPoint) {
                drawOil(lastPoint, pos);
                lastPoint = pos;
                return;
            }
            
            // Карандаш — тонкие штрихи
            if (currentBrush.mode === 'pencil' && lastPoint) {
                drawPencil(lastPoint, pos);
                lastPoint = pos;
                return;
            }
            
            // Обычная линия
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            lastPoint = pos;
        }
        
        function stopDrawing(e) {
            if (!isDrawing) return;
            isDrawing = false;
            lastPoint = null;
            ctx.closePath();
            
            if (sprayInterval) {
                clearInterval(sprayInterval);
                sprayInterval = null;
            }
        }
        
        // ========== ТЕКСТУРЫ ==========
        function drawSpray(pos) {
            const density = currentSizeLevel * 12;
            const radius = currentBrush.baseSize * currentSizeLevel * 1.5;
            
            ctx.fillStyle = currentColor;
            ctx.globalAlpha = currentBrush.opacity;
            
            for (let i = 0; i < density; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * radius;
                const x = pos.x + Math.cos(angle) * dist;
                const y = pos.y + Math.sin(angle) * dist;
                const size = Math.random() * 1.5 + 0.5;
                
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function drawWatercolor(from, to) {
            // Много слоёв с рандомным разбросом = эффект растекания
            const spread = currentBrush.baseSize * currentSizeLevel * 0.8;
            
            for (let i = 0; i < 5; i++) {
                const offsetX = (Math.random() - 0.5) * spread;
                const offsetY = (Math.random() - 0.5) * spread;
                
                ctx.beginPath();
                ctx.moveTo(from.x + offsetX, from.y + offsetY);
                ctx.lineTo(to.x + offsetX, to.y + offsetY);
                ctx.stroke();
            }
        }
        
        function drawCharcoal(from, to) {
            // Растушёвка — несколько полупрозрачных линий
            for (let i = 0; i < 3; i++) {
                ctx.globalAlpha = 0.2;
                ctx.lineWidth = currentBrush.baseSize * currentSizeLevel * (1 + i * 0.5);
                
                const jitterX = (Math.random() - 0.5) * 4;
                const jitterY = (Math.random() - 0.5) * 4;
                
                ctx.beginPath();
                ctx.moveTo(from.x + jitterX, from.y + jitterY);
                ctx.lineTo(to.x + jitterX, to.y + jitterY);
                ctx.stroke();
            }
            ctx.globalAlpha = currentBrush.opacity;
            ctx.lineWidth = currentBrush.baseSize * currentSizeLevel;
        }
        
        function drawOil(from, to) {
            // Текстура мазками — короткие разноцветные штрихи
            const length = currentBrush.baseSize * currentSizeLevel * 1.5;
            const count = 3;
            
            for (let i = 0; i < count; i++) {
                const angle = Math.atan2(to.y - from.y, to.x - from.x);
                const perpAngle = angle + Math.PI / 2;
                const offset = (i - count / 2) * 3;
                
                const startX = from.x + Math.cos(perpAngle) * offset;
                const startY = from.y + Math.sin(perpAngle) * offset;
                const endX = startX + Math.cos(angle) * length * 0.3;
                const endY = startY + Math.sin(angle) * length * 0.3;
                
                ctx.globalAlpha = 0.7 + Math.random() * 0.3;
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(endX, endY);
                ctx.stroke();
            }
            ctx.globalAlpha = currentBrush.opacity;
        }
        
        function drawPencil(from, to) {
            // Тонкие множественные штрихи для эффекта карандаша
            for (let i = 0; i < 4; i++) {
                const offsetX = (Math.random() - 0.5) * 2;
                const offsetY = (Math.random() - 0.5) * 2;
                
                ctx.globalAlpha = 0.3 + Math.random() * 0.3;
                ctx.lineWidth = 0.5;
                
                ctx.beginPath();
                ctx.moveTo(from.x + offsetX, from.y + offsetY);
                ctx.lineTo(to.x + offsetX, to.y + offsetY);
                ctx.stroke();
            }
            ctx.globalAlpha = currentBrush.opacity;
            ctx.lineWidth = currentBrush.baseSize * currentSizeLevel;
        }
        
        function drawPointTexture(pos) {
            // Точечные текстуры (звёзды, пузыри, листья, снежинки)
            const mode = currentBrush.mode;
            const size = currentBrush.baseSize * currentSizeLevel * 0.8;
            
            ctx.save();
            ctx.translate(pos.x, pos.y);
            ctx.fillStyle = currentColor;
            ctx.strokeStyle = currentColor;
            ctx.globalAlpha = currentBrush.opacity;
            
            switch (mode) {
                case 'stars':
                    // Звёздочка
                    drawStar(0, 0, 5, size, size / 2);
                    break;
                case 'bubbles':
                    // Кружок
                    ctx.beginPath();
                    ctx.arc(0, 0, size, 0, Math.PI * 2);
                    ctx.stroke();
                    break;
                case 'leaves':
                    // Листик
                    ctx.beginPath();
                    ctx.ellipse(0, 0, size, size * 0.5, Math.PI / 4, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'snow':
                    // Снежинка
                    for (let i = 0; i < 6; i++) {
                        const angle = (Math.PI / 3) * i;
                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        ctx.lineTo(Math.cos(angle) * size, Math.sin(angle) * size);
                        ctx.stroke();
                    }
                    break;
            }
            
            ctx.restore();
        }
        
        function drawStar(cx, cy, spikes, outerR, innerR) {
            let rot = Math.PI / 2 * 3;
            let step = Math.PI / spikes;
            
            ctx.beginPath();
            ctx.moveTo(cx, cy - outerR);
            
            for (let i = 0; i < spikes; i++) {
                ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
                rot += step;
                ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
                rot += step;
            }
            
            ctx.lineTo(cx, cy - outerR);
            ctx.closePath();
            ctx.fill();
        }
        
        // ========== ПОДПИСКИ ==========
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);
        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);
        canvas.addEventListener('touchcancel', stopDrawing);
        
        // ========== ИСТОРИЯ ==========
        function saveHistory() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            history.push(imageData);
            if (history.length > maxHistory) history.shift();
        }
        
        function undo() {
            if (history.length === 0) return;
            const imageData = history.pop();
            ctx.putImageData(imageData, 0, 0);
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }
        
        function clearCanvas() {
            if (!confirm('Очистить рисунок?')) return;
            saveHistory();
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvasSize, canvasSize);
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }
        
        // ========== UI ==========
        function renderBrushes() {
            const container = document.getElementById('brushesRow');
            container.innerHTML = BRUSHES.map(b => `
                <button class="brush-btn ${b.id === currentBrush.id ? 'active' : ''}"
                        onclick="selectBrush('${b.id}')"
                        title="${b.name}">
                    ${b.icon}
                </button>
            `).join('');
        }
        
        function selectBrush(id) {
            currentBrush = BRUSHES.find(b => b.id === id);
            applyBrushSettings();
            renderBrushes();
            updateSizePreview();
            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }
        
        function renderColors() {
            const container = document.getElementById('colorsRow');
            
            let html = COLORS.map(c => `
                <button class="color-btn ${c === currentColor ? 'active' : ''}"
                        style="background: ${c}"
                        onclick="selectColor('${c}')">
                </button>
            `).join('');
            
            html += `
                <div class="color-picker">
                    🎨
                    <input type="color" value="${currentColor}" onchange="selectColor(this.value)">
                </div>
            `;
            
            container.innerHTML = html;
        }
        
        function selectColor(color) {
            currentColor = color;
            if (currentBrush.mode !== 'eraser' && currentBrush.mode !== 'rainbow') {
                ctx.strokeStyle = color;
                ctx.fillStyle = color;
            }
            renderColors();
            updateSizePreview();
            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }
        
        function updateSizePreview() {
            const preview = document.getElementById('sizePreview');
            const sizes = [4, 6, 10, 16, 24];
            const size = sizes[currentSizeLevel - 1];
            
            preview.style.width = size + 'px';
            preview.style.height = size + 'px';
            preview.style.background = currentBrush.mode === 'eraser' ? '#ddd' : currentColor;
        }
        
        document.getElementById('sizeSlider').addEventListener('input', (e) => {
            currentSizeLevel = parseInt(e.target.value);
            applyBrushSettings();
            updateSizePreview();
        });
        
        // ========== ЗАГРУЗКА КАРТИНКИ ==========
        function loadImage() {
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        saveHistory();
                        
                        // Вписываем картинку в canvas с сохранением пропорций
                        const canvasRatio = canvasSize / canvasSize;
                        const imgRatio = img.width / img.height;
                        
                        let drawWidth, drawHeight, offsetX = 0, offsetY = 0;
                        
                        if (imgRatio > canvasRatio) {
                            drawWidth = canvasSize;
                            drawHeight = canvasSize / imgRatio;
                            offsetY = (canvasSize - drawHeight) / 2;
                        } else {
                            drawHeight = canvasSize;
                            drawWidth = canvasSize * imgRatio;
                            offsetX = (canvasSize - drawWidth) / 2;
                        }
                        
                        ctx.globalAlpha = 0.5; // Полупрозрачная подложка
                        ctx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);
                        ctx.globalAlpha = currentBrush.opacity;
                        
                        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };
            
            input.click();
        }
        
        // ========== СОХРАНЕНИЕ КАРТИНКИ ==========
        function saveImage() {
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            
            try {
                const dataURL = canvas.toDataURL('image/png');
                
                // Создаём ссылку для скачивания
                const link = document.createElement('a');
                link.download = `рисовашка_${todayTheme.text.replace(/\s+/g, '_')}_${Date.now()}.png`;
                link.href = dataURL;
                link.click();
                
                if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } catch (e) {
                console.error('Save error:', e);
                alert('Не удалось сохранить. Попробуй долгое нажатие на картинку → "Сохранить".');
            }
        }
        
        // ========== ЗАВЕРШЕНИЕ ==========
        function finishDrawing() {
            const imageData = canvas.toDataURL('image/png');
            
            Storage.addBalance(10);
            const streak = Storage.updateStreak();
            
            const drawing = Storage.saveDrawing({
                theme: todayTheme.text,
                themeEmoji: todayTheme.emoji,
                image: imageData
            });
            
            if (streak > 1 && streak % 7 === 0) {
                Storage.addBalance(50);
                if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            }
            
            document.getElementById('modalSub').textContent =
                `Ты нарисовал(а) «${todayTheme.text}»`;
            
            document.getElementById('successModal').classList.add('open');
            document.getElementById('successModal').dataset.drawingId = drawing.id;
            
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }
        
        function continueDrawing() {
            document.getElementById('successModal').classList.remove('open');
            history = [];
            clearCanvas();
        }
        
        // ========== СТАРТ ==========
        window.addEventListener('load', () => {
            initCanvas();
            applyBrushSettings();
            renderBrushes();
            renderColors();
            updateSizePreview();
        });
        
        setTimeout(() => showHint(), 1500);
        
        console.log('🎨 Рисовашка: 16 кистей загружено');
    </script>
</body>
</html>
